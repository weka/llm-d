name: Build Weka CUDA 13 Image

# Builds llm-d for the Weka GDS/RDMA stack:
#   - Platform:  ARM64 (aarch64), CUDA 13.0
#   - vLLM:      0.15.1 (static PyPI wheel)
#   - LMCache:   weka fork, wheel downloaded from github.com/weka/LMCache releases
#   - Base image: nvcr.io/nvidia/cuda:13.0.0-devel-ubuntu24.04
#
# Versioning: automatically derived from the most recent llm-d release tag (v*)
#   reachable from HEAD + commit count since that tag.
#   e.g. on a branch 97 commits past v0.5.0: 0.5.0+weka.97 → release tag v0.5.0-weka.97
#   No manual tagging required (unlike the lmcache fork which needs weka-v* tags).
#
# Triggers:
#   - push to feat/weka-gds-rdma  → build + push image + create GitHub Release
#   - PRs from feat/weka* branches → build + push image with pr-<N> tag (no release)
#   - workflow_dispatch            → manual trigger

on:
  push:
    branches:
      - feat/weka-gds-rdma
  pull_request:
    branches:
      - feat/weka-gds-rdma
  workflow_dispatch:
    inputs:
      lmcache_weka_tag:
        description: "weka/LMCache release tag (e.g. v0.3.14-weka.60)"
        required: false
        default: "v0.3.14-weka.60"
        type: string
      vllm_version:
        description: "vLLM version to install (PyPI)"
        required: false
        default: "0.15.1"
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/llm-d-weka-cuda
  VLLM_VERSION: ${{ inputs.vllm_version || '0.15.1' }}
  LMCACHE_WEKA_TAG: ${{ inputs.lmcache_weka_tag || 'v0.3.14-weka.60' }}

defaults:
  run:
    shell: bash

permissions:
  contents: write   # required for gh release create
  packages: write   # required for GHCR push

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build llm-d weka image (ARM64 / CUDA 13.0)
    runs-on: self-hosted

    # For pull_request events: only run if the source branch is a feat/weka* branch.
    # For push/dispatch events: github.head_ref is empty, so the condition passes through.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feat/weka')

    steps:
      - name: Checkout llm-d
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Fetch tags for version detection
        run: git fetch origin --tags

      - name: Compute weka version
        id: version
        run: |
          # Use the most recent llm-d release tag (v*) reachable from HEAD as the base.
          # Unlike the lmcache fork (which needs a separate weka-v* tag to identify which
          # upstream version it rebased onto), llm-d's own v* tags are the correct base —
          # the weka work is a branch of llm-d itself, not a fork of something else.
          BASE_TAG=$(git describe --tags --match "v[0-9]*" --abbrev=0 2>/dev/null || echo "v0.5.0")
          UPSTREAM_VERSION="${BASE_TAG#v}"
          WEKA_COMMITS=$(git rev-list "${BASE_TAG}..HEAD" --count)

          WEKA_VERSION="${UPSTREAM_VERSION}+weka.${WEKA_COMMITS}"
          # Release tag uses '-' instead of '+' since '+' is not valid in git ref names
          RELEASE_TAG="v${WEKA_VERSION//+/-}"

          echo "weka_version=${WEKA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}"   >> "$GITHUB_OUTPUT"
          echo "Building version: ${WEKA_VERSION}  (release tag: ${RELEASE_TAG})"

      # -----------------------------------------------------------------------
      # Build the image.
      # The Dockerfile downloads the lmcache wheel directly from GitHub releases
      # (LMCACHE_WHEEL_SRC=remote, the default), so no separate wheel build step
      # is needed here.
      # -----------------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image_tags
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          WEKA_VERSION: ${{ steps.version.outputs.weka_version }}
        run: |
          TAG_PREFIX="${REGISTRY}/${IMAGE_REPO}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PRs: ephemeral tag for inspection, no formal release
            PR_TAG="${TAG_PREFIX}:pr-${{ github.event.pull_request.number }}"
            echo "tags=${PR_TAG}" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${PR_TAG}" >> "$GITHUB_OUTPUT"
          else
            # Pushes / dispatch: versioned tag + latest
            VER_TAG="${TAG_PREFIX}:${RELEASE_TAG}"
            LATEST_TAG="${TAG_PREFIX}:latest"
            echo "tags=${VER_TAG},${LATEST_TAG}" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${VER_TAG}"         >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push llm-d weka image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.weka-cuda13
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          build-args: |
            VLLM_VERSION=${{ env.VLLM_VERSION }}
            LMCACHE_WEKA_TAG=${{ env.LMCACHE_WEKA_TAG }}
          labels: |
            org.opencontainers.image.title=llm-d weka (ARM64/CUDA 13)
            org.opencontainers.image.description=llm-d ${{ steps.version.outputs.weka_version }} — vLLM ${{ env.VLLM_VERSION }} + LMCache ${{ env.LMCACHE_WEKA_TAG }} (Weka GDS/RDMA, CUDA 13.0)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.weka_version }}

      # PRs: the pushed pr-<N> image acts as the temporary artifact for inspection.
      # It will be overwritten on the next push to the PR and is not a formal release.
      - name: Summarize PR build
        if: github.event_name == 'pull_request'
        env:
          PRIMARY_TAG: ${{ steps.image_tags.outputs.primary_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### PR image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${PRIMARY_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Digest** | \`${DIGEST}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **LMCache** | \`${{ env.LMCACHE_WEKA_TAG }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **vLLM** | \`${{ env.VLLM_VERSION }}\` |" >> "$GITHUB_STEP_SUMMARY"

      # Merges to feat/weka-gds-rdma: create a versioned GitHub Release.
      # The release notes record the exact image digest and the component versions,
      # so the artifact is permanently traceable.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          WEKA_VERSION: ${{ steps.version.outputs.weka_version }}
          PRIMARY_TAG: ${{ steps.image_tags.outputs.primary_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > /tmp/release-notes.md << EOF
          ## llm-d ${WEKA_VERSION} — ARM64 / CUDA 13.0

          **Image:** \`${PRIMARY_TAG}\`
          **Digest:** \`${DIGEST}\`

          | Component | Version |
          |---|---|
          | vLLM | \`${{ env.VLLM_VERSION }}\` |
          | LMCache | \`${{ env.LMCACHE_WEKA_TAG }}\` |
          | CUDA | 13.0 |
          | Platform | linux/arm64 |

          ### Pull

          \`\`\`
          docker pull ${PRIMARY_TAG}
          # or by digest (immutable):
          docker pull ${REGISTRY}/${IMAGE_REPO}@${DIGEST}
          \`\`\`
          EOF

          gh release create "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Weka llm-d ${WEKA_VERSION}" \
            --notes-file /tmp/release-notes.md
