# KV-aware routing infrastructure (model-agnostic).
# Requires MODEL_NAME env var to be set by the model overlay.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LMCACHE_ENABLE_KV_EVENTS
    value: "true"
# KV events config: $(POD_IP) and $(MODEL_NAME) are substituted by Kubernetes
# from env vars defined above and in the model overlay respectively.
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--kv-events-config"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","topic":"kv@$(POD_IP)@$(MODEL_NAME)"}'
# Expose ZMQ kv-events port so EPP can discover and connect to it.
- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    containerPort: 5557
    name: kv-events
    protocol: TCP
