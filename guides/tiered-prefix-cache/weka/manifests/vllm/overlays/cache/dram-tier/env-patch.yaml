# Additive DRAM tier: enables CPU-based LMCache on top of Weka GDS.
# Overrides LMCACHE_LOCAL_CPU=false (set by Weka patch) to true.
# Apply AFTER lmcache-weka patches.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LMCACHE_LOCAL_CPU
    value: "true"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LMCACHE_MAX_LOCAL_CPU_SIZE
    value: "300"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LMCACHE_PRE_CACHING_HASH_ALGORITHM
    value: "sha256"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LMCACHE_SAVE_DECODE_CACHE
    value: "false"
