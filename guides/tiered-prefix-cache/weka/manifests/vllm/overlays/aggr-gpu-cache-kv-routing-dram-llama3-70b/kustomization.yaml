apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aggregated mode with DRAM-based LMCache + KV-aware routing via EPP.
# Composes: aggregated-weka base + gateway + KV-aware-routing mixin + DRAM cache mixin + inferencepool helm chart.
# Difference from aggr-gpu-cache-kv-routing-llama3-70b:
#   - Keeps LMCache (with DRAM backend instead of GDS/Weka)
#   - Keeps --kv-transfer-config with LMCacheConnectorV1

resources:
  - ../aggregated-weka
  - ../../../gateway/overlays/istio

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    releaseName: weka-vllm
    valuesFile: ../mixin-kv-aware-routing/inferencepool.values.yaml

patches:
  # Override args: keep LMCacheConnectorV1 but use block-size 64 for KV-aware routing
  - path: deployment-patch.yaml

  # KV-aware routing env vars from mixin (POD_IP + LMCACHE_ENABLE_KV_EVENTS)
  - path: ../mixin-kv-aware-routing/deployment-kv-events-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # DRAM cache mixin: switch LMCache to DRAM, add DRAM-specific env vars, increase memory
  - path: ../mixin-dram-cache/deployment-dram-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # EPP: remove hardcoded --pool-namespace so it uses NAMESPACE env var from downward API
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/args/2
      - op: remove
        path: /spec/template/spec/containers/0/args/2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
