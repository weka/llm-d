# Override args: no --kv-transfer-config (GPU-only HBM cache), block-size 64 for KV-aware routing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-model-server
spec:
  template:
    spec:
      containers:
      - name: vllm
        args:
        - RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
        - --port
        - '8000'
        - --served-model-name
        - RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
        - --tensor-parallel-size
        - '4'
        - --block-size
        - '64'
        - --gpu-memory-utilization
        - '0.80'
        - --disable-log-requests
        - --disable-uvicorn-access-log
        - --max-model-len
        - '125000'
        - --enable-auto-tool-choice
        - --tool-call-parser
        - llama3_json
