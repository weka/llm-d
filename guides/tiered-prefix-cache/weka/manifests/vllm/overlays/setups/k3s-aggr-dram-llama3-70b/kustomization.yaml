apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weka

# K3s variant: Aggregated mode with LMCache DRAM backend.

resources:
  - ../../serving/aggregated

components:
  - ../../shared/k3s-workarounds

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    namespace: weka
    releaseName: weka-vllm
    valuesFile: ../../epp/aggregated.values.yaml

images:
  - name: quay.io/weka.io/llm-d
    newTag: v0.5.0-weka-ftruncate-fix

patches:
  # Model-specific env vars (MODEL_NAME)
  - path: ../../model/llama3-70b/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add LMCache DRAM env vars
  - path: ../../cache/lmcache-dram/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add lmcache-prometheus volume + volumeMount
  - path: ../../cache/lmcache-dram/volume-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add --kv-transfer-config with LMCacheConnectorV1
  - path: ../../cache/lmcache-dram/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Increase memory for DRAM cache
  - path: ../../cache/lmcache-dram/memory-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # DRAM cache size for TP4 (300 GB)
  - path: ../../model/llama3-70b/dram-size-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # EPP: use IfNotPresent for image pinned by tag
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # Single replica pinned to node .02 for now
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: "10.71.0.2"
