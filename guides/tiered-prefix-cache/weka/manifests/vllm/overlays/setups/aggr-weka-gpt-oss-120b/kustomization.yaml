apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weka

# Aggregated mode with Weka GDS LMCache, basic routing.
# Model: openai/gpt-oss-120b (MoE, TP8).

resources:
  - ../../serving/aggregated

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    namespace: weka
    releaseName: weka-vllm
    valuesFile: ../../epp/aggregated.values.yaml

patches:
  # Override args for gpt-oss-120b
  - path: ../../model/gpt-oss-120b/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Override GPU count for TP8
  - path: ../../model/gpt-oss-120b/gpu-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add LMCache Weka GDS env vars
  - path: ../../cache/lmcache-weka/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Explicitly disable CPU/DRAM cache (pure Weka GDS)
  - path: ../../cache/no-cpu-cache/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add lmcache-prometheus volume + volumeMount
  - path: ../../cache/lmcache-weka/volume-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add --kv-transfer-config with LMCacheConnectorV1
  - path: ../../cache/lmcache-weka/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # EPP: use IfNotPresent for image pinned by tag
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
