apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weka

# Aggregated mode, GPU-only KV cache (no LMCache), KV-aware routing.
# Model: openai/gpt-oss-120b (MoE, TP8).

resources:
  - ../../serving/aggregated

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    namespace: weka
    releaseName: weka-vllm
    valuesFile: ../../model/gpt-oss-120b/epp-kv-aware.values.yaml

patches:
  # Override args for gpt-oss-120b
  - path: ../../model/gpt-oss-120b/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Override block-size to 256 for KV-aware routing (matches LMCACHE_CHUNK_SIZE=256)
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/8
        value: "256"

  # Override GPU count for TP8
  - path: ../../model/gpt-oss-120b/gpu-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # KV-aware routing env vars + KV events config
  - path: ../../model/gpt-oss-120b/kv-events-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # EPP: use IfNotPresent for image pinned by tag
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
