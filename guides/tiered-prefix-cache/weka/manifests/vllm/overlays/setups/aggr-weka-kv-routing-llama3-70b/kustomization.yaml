apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weka

# Aggregated mode with Weka GDS + DRAM tiered LMCache + KV-aware routing via EPP.

resources:
  - ../../serving/aggregated

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    namespace: weka
    releaseName: weka-vllm
    valuesFile: ../../epp/kv-aware-dram.values.yaml

patches:
  # Model-specific env vars (MODEL_NAME for KV events topic)
  - path: ../../model/llama3-70b/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add LMCache Weka GDS env vars
  - path: ../../cache/lmcache-weka/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add lmcache-prometheus volume + volumeMount
  - path: ../../cache/lmcache-weka/volume-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add --kv-transfer-config with LMCacheConnectorV1
  - path: ../../cache/lmcache-weka/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add DRAM tier on top of Weka (overrides LMCACHE_LOCAL_CPU=false → true)
  - path: ../../cache/dram-tier/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # DRAM cache size for TP4 (300 GB)
  - path: ../../model/llama3-70b/dram-size-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Increase memory for DRAM cache
  - path: ../../cache/lmcache-dram/memory-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # KV-aware routing (POD_IP, LMCACHE_ENABLE_KV_EVENTS, --kv-events-config, ZMQ port)
  - path: ../../cache/kv-aware/deployment-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # EPP: add model-specific scoring config to ConfigMap
  - path: ../../model/llama3-70b/epp-configmap-patch-dram.yaml

  # EPP: use IfNotPresent for image pinned by tag
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
