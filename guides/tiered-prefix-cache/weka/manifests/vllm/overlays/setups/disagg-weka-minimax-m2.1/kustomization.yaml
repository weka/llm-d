apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weka

# Disaggregated with Weka GDS LMCache + MiniMax-M2.1 model, P/D routing via EPP.

resources:
  - ../../serving/disaggregated

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    namespace: weka
    releaseName: weka-vllm
    valuesFile: ../../epp/disagg.values.yaml

labels:
  - pairs:
      llm-d.ai/model: MiniMax-M2-1
    includeSelectors: false

patches:
  # Add LMCache Weka GDS env vars to decode and prefill (not EPP)
  - path: ../../cache/lmcache-weka/env-patch.yaml
    target:
      kind: Deployment
      name: decode
  - path: ../../cache/lmcache-weka/env-patch.yaml
    target:
      kind: Deployment
      name: prefill

  # Add lmcache-prometheus volume + volumeMount to decode and prefill (not EPP)
  - path: ../../cache/lmcache-weka/volume-patch.yaml
    target:
      kind: Deployment
      name: decode
  - path: ../../cache/lmcache-weka/volume-patch.yaml
    target:
      kind: Deployment
      name: prefill

  # Replace decode args for MiniMax-M2.1 (includes MultiConnector)
  - target:
      kind: Deployment
      name: decode
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - "MiniMaxAI/MiniMax-M2.1"
          - "--port"
          - "8200"
          - "--served-model-name"
          - "MiniMaxAI/MiniMax-M2.1"
          - "--trust-remote-code"
          - "--tensor-parallel-size"
          - "8"
          - "--block-size"
          - "128"
          - "--kv-transfer-config"
          - '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"},{"kv_connector":"NixlConnector","kv_role":"kv_both"}]}}'
          - "--gpu-memory-utilization"
          - "0.80"
          - "--disable-log-requests"
          - "--disable-uvicorn-access-log"
          - "--max-model-len"
          - "196000"
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "minimax_m2"
          - "--reasoning-parser"
          - "minimax_m2_append_think"

  # Replace prefill args for MiniMax-M2.1 (includes MultiConnector)
  - target:
      kind: Deployment
      name: prefill
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - "MiniMaxAI/MiniMax-M2.1"
          - "--port"
          - "8000"
          - "--served-model-name"
          - "MiniMaxAI/MiniMax-M2.1"
          - "--trust-remote-code"
          - "--tensor-parallel-size"
          - "8"
          - "--block-size"
          - "128"
          - "--kv-transfer-config"
          - '{"kv_connector":"MultiConnector","kv_role":"kv_both","kv_connector_extra_config":{"connectors":[{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"},{"kv_connector":"NixlConnector","kv_role":"kv_both"}]}}'
          - "--gpu-memory-utilization"
          - "0.80"
          - "--disable-log-requests"
          - "--disable-uvicorn-access-log"
          - "--max-model-len"
          - "196000"
          - "--enable-auto-tool-choice"
          - "--tool-call-parser"
          - "minimax_m2"
          - "--reasoning-parser"
          - "minimax_m2_append_think"

  # Override GPU resources to 8 for decode and prefill (not EPP)
  - target:
      kind: Deployment
      name: decode
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: "8"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu
        value: "8"
  - target:
      kind: Deployment
      name: prefill
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: "8"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu
        value: "8"

  # Add SAFETENSORS_FAST_GPU env var to decode and prefill (not EPP)
  - target:
      kind: Deployment
      name: decode
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SAFETENSORS_FAST_GPU
          value: "1"
  - target:
      kind: Deployment
      name: prefill
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: SAFETENSORS_FAST_GPU
          value: "1"

  # EPP: use IfNotPresent for image pinned by tag
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
