apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weka

# Aggregated mode with DRAM-based LMCache + KV-aware routing.
# Model: openai/gpt-oss-120b (MoE, TP8).

resources:
  - ../../serving/aggregated

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    namespace: weka
    releaseName: weka-vllm
    valuesFile: ../../epp/kv-aware-dram.values.yaml

patches:
  # Override args for gpt-oss-120b
  - path: ../../model/gpt-oss-120b/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Override block-size to 256 for KV-aware routing (matches LMCACHE_CHUNK_SIZE=256)
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/8
        value: "256"

  # Override GPU count for TP8
  - path: ../../model/gpt-oss-120b/gpu-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Model-specific env vars (MODEL_NAME for KV events topic)
  - path: ../../model/gpt-oss-120b/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add LMCache DRAM env vars
  - path: ../../cache/lmcache-dram/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add lmcache-prometheus volume + volumeMount
  - path: ../../cache/lmcache-dram/volume-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add --kv-transfer-config with LMCacheConnectorV1
  - path: ../../cache/lmcache-dram/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Increase memory for DRAM cache
  - path: ../../cache/lmcache-dram/memory-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Override DRAM size for TP8 (150 GB vs 300 GB default)
  - path: ../../model/gpt-oss-120b/dram-size-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # KV-aware routing (POD_IP, LMCACHE_ENABLE_KV_EVENTS, --kv-events-config, ZMQ port)
  - path: ../../cache/kv-aware/deployment-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # EPP: add model-specific scoring config to ConfigMap
  - path: ../../model/gpt-oss-120b/epp-configmap-patch.yaml

  # EPP: use IfNotPresent for image pinned by tag
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
