apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weka

# K3s variant: Aggregated mode with Weka GDS LMCache + buffer pool.
# Uses 32 independently registered 32MiB cuFile buffers for parallel GDS IO.
# Compare against k3s-aggr-weka-llama3-70b (single shared buffer) for perf delta.

resources:
  - ../../serving/aggregated

components:
  - ../../shared/k3s-workarounds

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    namespace: weka
    releaseName: weka-vllm
    valuesFile: ../../epp/aggregated.values.yaml

images:
  - name: quay.io/weka.io/llm-d
    newTag: v0.5.0-weka-buffer-pool

patches:
  # Model-specific env vars (MODEL_NAME)
  - path: ../../model/llama3-70b/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add LMCache Weka GDS env vars
  - path: ../../cache/lmcache-weka/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Explicitly disable CPU/DRAM cache (pure Weka GDS)
  - path: ../../cache/no-cpu-cache/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add lmcache-prometheus volume + volumeMount
  - path: ../../cache/lmcache-weka/volume-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add --kv-transfer-config with LMCacheConnectorV1
  - path: ../../cache/lmcache-weka/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Override LMCACHE_EXTRA_CONFIG to enable buffer pool (32 × 32 MiB)
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_EXTRA_CONFIG
          value: '{"gds_io_threads": 32, "cufile_buffer_pool_size": 32, "cufile_buffer_pool_buf_size_mb": 32}'

  # EPP: use IfNotPresent for image pinned by tag
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # Single replica pinned to node .02 for now
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: "10.71.0.2"
