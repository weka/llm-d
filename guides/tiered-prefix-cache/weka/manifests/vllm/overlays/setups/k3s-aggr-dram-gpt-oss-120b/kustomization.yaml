apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weka

# K3s variant: Aggregated mode with LMCache DRAM backend.
# Model: openai/gpt-oss-120b (MoE, TP8).

resources:
  - ../../serving/aggregated
  - ../../model/gpt-oss-120b/chat-template-configmap.yaml

components:
  - ../../shared/k3s-workarounds

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    namespace: weka
    releaseName: weka-vllm
    valuesFile: ../../epp/aggregated.values.yaml

images:
  - name: quay.io/weka.io/llm-d
    newTag: v0.5.0-weka-ftruncate-fix

patches:
  # Override args for gpt-oss-120b
  - path: ../../model/gpt-oss-120b/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Override GPU count for TP8
  - path: ../../model/gpt-oss-120b/gpu-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Model-specific env vars (MODEL_NAME)
  - path: ../../model/gpt-oss-120b/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Mount chat_template.jinja ConfigMap
  - path: ../../model/gpt-oss-120b/vllm-chat-template-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add LMCache DRAM env vars
  - path: ../../cache/lmcache-dram/env-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add lmcache-prometheus volume + volumeMount
  - path: ../../cache/lmcache-dram/volume-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Add --kv-transfer-config with LMCacheConnectorV1
  - path: ../../cache/lmcache-dram/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Increase memory for DRAM cache
  - path: ../../cache/lmcache-dram/memory-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # Override DRAM size for TP8 (150 GB vs 300 GB default)
  - path: ../../model/gpt-oss-120b/dram-size-patch.yaml
    target:
      kind: Deployment
      name: llm-d-model-server

  # EPP: use IfNotPresent for image pinned by tag
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # Remove --disable-log-requests and --disable-uvicorn-access-log (removed in vLLM 0.18.0)
  # These are re-introduced by gpt-oss-120b/args-patch-aggr.yaml after k3s-workarounds strips them.
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/args/12
      - op: remove
        path: /spec/template/spec/containers/0/args/11
  # Re-strip nvidia.com/gpu after gpu-patch (no device plugin on k3s)
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
      - op: remove
        path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu

  # Increase startup probe timeout for OSS-120 (MoE model compilation takes 15+ min)
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 360
  # Single replica pinned to node .02 for now
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: "10.71.0.2"
