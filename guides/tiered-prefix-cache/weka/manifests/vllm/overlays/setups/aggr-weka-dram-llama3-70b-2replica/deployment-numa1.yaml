# NUMA 1 deployment: GPUs 4-7, NUMA1-local NICs.
#
# WHY SELF-CONTAINED: The base chain (recipes/vllm/base → weka/base →
# serving/aggregated) patches target 'name: llm-d-model-server' specifically.
# This deployment has a different name, so those patches don't apply.
# The weka-infra component (RDMA, security, PVC, strategy, imagePullSecrets)
# only patches resources within serving/aggregated's scope — not resources
# added at the setup level. So this deployment must carry the full spec.
#
# Cache/model/GDS-init patches are applied via labelSelector in kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-model-server-numa1
  namespace: weka
  labels:
    llm-d.ai/inference-serving: "true"
    llm-d.ai/model: Llama-33-70B-Instruct
    llm-d.ai/numa-node: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/role: aggregated
      llm-d.ai/numa-node: "1"
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        llm-d.ai/accelerator-vendor: nvidia
        llm-d.ai/hardware-variant: gpu
        llm-d.ai/inference-serving: "true"
        llm-d.ai/model: Llama-33-70B-Instruct
        llm-d.ai/role: aggregated
        llm-d.ai/numa-node: "1"
    spec:
      hostNetwork: false
      serviceAccountName: weka-vllm
      enableServiceLinks: false
      terminationGracePeriodSeconds: 130
      imagePullSecrets:
      - name: ghcr-secret
      initContainers:
      # [0] cufile config generator
      - name: create-cufile
        image: ghcr.io/llm-d/llm-d-cuda-dev-ubuntu:sha-8c00fce
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - curl -fsSL -o /tmp/amgctl https://github.com/4D0R/amg-utils/releases/download/v0.1.21-gds/amgctl-linux-amd64
          && chmod +x /tmp/amgctl && /tmp/amgctl host config cufile /output/cufile.json
        volumeMounts:
        - name: cufile-output
          mountPath: /output
      # [1] GDS kernel module loader (WekaFS check is non-fatal — see base/kustomization.yaml)
      - name: enable-nvidia-gds
        image: ghcr.io/llm-d/llm-d-cuda-dev-ubuntu:sha-990d488
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
        - |
          lsmod | grep -q nvidia_fs || modprobe nvidia_fs || { echo "ERROR: Failed to load nvidia_fs" >&2; exit 1; }
          lsmod | grep -q nvidia_peermem || modprobe nvidia_peermem || { echo "ERROR: Failed to load nvidia_peermem" >&2; exit 1; }
          echo "GDS modules loaded successfully"
          nvidia-smi > /dev/null 2>&1 || true
          echo "=== GDS Configuration Check ==="
          GDS_OUT=$(/usr/local/cuda/gds/tools/gdscheck -p 2>&1)
          echo "$GDS_OUT"
          if echo "$GDS_OUT" | grep -q "WekaFS.*: Supported"; then
            echo "GDS: WekaFS Supported, RDMA Up"
          else
            echo "WARNING: WekaFS GDS check unsupported in init container (WEKA not mounted here)." >&2
            echo "GDS modules are loaded; WEKA GDS will be available in the main container." >&2
          fi
        securityContext:
          privileged: true
          runAsUser: 0
        volumeMounts:
        - name: ib-uverbs
          mountPath: /dev/infiniband
        - name: cufile-output
          mountPath: /etc/cufile.json
          subPath: cufile.json
      containers:
      - name: vllm
        image: quay.io/weka.io/llm-d:ver3
        imagePullPolicy: IfNotPresent
        command: ["vllm", "serve"]
        args:
        - RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
        - --port
        - "8000"
        - --served-model-name
        - RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
        - --tensor-parallel-size
        - "4"
        - --block-size
        - "128"
        - --gpu-memory-utilization
        - "0.80"
        - --disable-log-requests
        - --disable-uvicorn-access-log
        - --max-model-len
        - "125000"
        - --enable-auto-tool-choice
        - --tool-call-parser
        - llama3_json
        env:
        - name: VLLM_LOGGING_LEVEL
          value: INFO
        - name: NCCL_DEBUG
          value: INFO
        - name: HF_HOME
          value: /mnt/weka/hf_cache
        - name: NVIDIA_GDRCOPY
          value: enabled
        - name: NVIDIA_GDS
          value: enabled
        - name: PYTHONHASHSEED
          value: "0"
        # --- NUMA1-specific ---
        - name: UCX_NET_DEVICES
          value: "mlx5_6:1,mlx5_7:1,mlx5_8:1,mlx5_9:1,mlx5_10:1"
        - name: CUDA_VISIBLE_DEVICES
          value: "4,5,6,7"
        - name: HOME
          value: "/tmp"
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: "16"
            memory: 400Gi
            nvidia.com/gpu: "4"
          requests:
            cpu: "16"
            memory: 400Gi
            nvidia.com/gpu: "4"
        securityContext:
          privileged: true
          capabilities:
            add:
            - IPC_LOCK
            - SYS_RESOURCE
        lifecycle:
          preStop:
            sleep:
              seconds: 30
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - mountPath: /dev/shm
          name: shm
        - mountPath: /mnt/weka
          name: weka-storage
        - mountPath: /etc/cufile.json
          name: cufile-output
          readOnly: true
          subPath: cufile.json
        - mountPath: /dev/infiniband/rdma_cm
          name: ib-rdma-cm
        - mountPath: /dev/infiniband
          name: ib-uverbs
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: weka-storage
        persistentVolumeClaim:
          claimName: weka-amg
      - name: cufile-output
        emptyDir: {}
      - name: ib-rdma-cm
        hostPath:
          path: /dev/infiniband/rdma_cm
      - name: ib-uverbs
        hostPath:
          path: /dev/infiniband
