# NUMA 0 pinning patch: 1 replica, GPUs 0-3, NUMA0 NICs, no hostNetwork.
# Applied to the base llm-d-model-server deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-model-server
spec:
  replicas: 1
  template:
    spec:
      # Disable hostNetwork to avoid port conflict with numa1 on same node.
      # RDMA works via mounted /dev/infiniband + privileged mode.
      hostNetwork: false
      containers:
      - name: vllm
        env:
        # Pin to GPUs 0-3 (NUMA node 0)
        - name: CUDA_VISIBLE_DEVICES
          value: "0,1,2,3"
        # NUMA0-local NICs only
        - name: UCX_NET_DEVICES
          value: "mlx5_0:1,mlx5_2:1,mlx5_3:1,mlx5_4:1,mlx5_5:1"
        # Writable home for flashinfer JIT cache (container fs is read-only)
        - name: HOME
          value: "/tmp"
        resources:
          limits:
            cpu: "16"
            memory: 400Gi
            nvidia.com/gpu: "4"
          requests:
            cpu: "16"
            memory: 400Gi
            nvidia.com/gpu: "4"
