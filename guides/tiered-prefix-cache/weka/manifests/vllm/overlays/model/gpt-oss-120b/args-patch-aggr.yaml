# Override vLLM args for openai/gpt-oss-120b (aggregated mode).
# MoE model: 120B total params, 5.1B active, 128 experts, top-4 routing.
- op: replace
  path: /spec/template/spec/containers/0/args
  value:
    - openai/gpt-oss-120b
    - "--port"
    - "8000"
    - "--served-model-name"
    - openai/gpt-oss-120b
    - "--tensor-parallel-size"
    - "8"
    - "--block-size"
    - "256"
    - "--gpu-memory-utilization"
    - "0.80"
    - "--disable-log-requests"
    - "--disable-uvicorn-access-log"
    - "--max-model-len"
    - "128000"
    - "--prefix-caching-hash-algo"
    - "sha256_cbor"
    - "--chat-template"
    - "/chat-template/chat_template.jinja"
    - "--enable-auto-tool-choice"
    - "--tool-call-parser"
    - openai
