# KV-aware routing: POD_IP, KV events, ZMQ port for gpt-oss-120b.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: LMCACHE_ENABLE_KV_EVENTS
    value: "true"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: "--kv-events-config"
- op: add
  path: /spec/template/spec/containers/0/args/-
  value: '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","topic":"kv@$(POD_IP)@openai/gpt-oss-120b"}'
- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    containerPort: 5557
    name: kv-events
    protocol: TCP
