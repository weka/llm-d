# MiniMax M2.1 requires SAFETENSORS_FAST_GPU for model loading.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: SAFETENSORS_FAST_GPU
    value: "1"
# Used by cache/kv-aware/deployment-patch.yaml in the KV events topic.
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: MODEL_NAME
    value: "MiniMaxAI/MiniMax-M2.1"
