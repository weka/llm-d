apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Weka infrastructure: hostPath storage, RDMA, hostNetwork, privileged security context.
# Used by disaggregated/ and aggregated/ serving mode layers.
# Also owns shared resources common to both modes.

resources:
  - ../serviceAccount.yaml
  - ../podmonitor.yaml
  - ../../../../gateway/overlays/istio
  - ../envoyfilter-extproc.yaml

patches:
  # Patch weka-storage volume to use PVC
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/1
        value:
          name: weka-storage
          persistentVolumeClaim:
            claimName: weka-amg

  # Use Recreate strategy (delete old pods before creating new ones)
  # GPU pods can't coexist on same node during rolling updates
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: Recreate

  # Add hostNetwork for RDMA access without device plugin
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/hostNetwork
        value: true

  # Add privileged security context for unlimited memlock (RDMA memory pinning)
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          privileged: true
          capabilities:
            add:
              - IPC_LOCK
              - SYS_RESOURCE

  # Add RDMA device volumes
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ib-rdma-cm
          hostPath:
            path: /dev/infiniband/rdma_cm
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: ib-uverbs
          hostPath:
            path: /dev/infiniband

  # Add RDMA device mounts to vllm container
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: ib-rdma-cm
          mountPath: /dev/infiniband/rdma_cm
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: ib-uverbs
          mountPath: /dev/infiniband

  # Add imagePullSecrets for private registry access
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-secret
