apiVersion: v1
kind: ConfigMap
metadata:
  name: lmcache-config
data:
  config.yaml: |
    # LMCache Configuration for WEKA GDS - Dev/Debug
    # Edit with: kubectl edit configmap lmcache-config -n weka-ofer
    # Then restart: kubectl rollout restart deployment/decode deployment/prefill -n weka-ofer
    
    use_experimental: true
    chunk_size: 256
    local_cpu: false
    
    # GDS (GPUDirect Storage) settings
    gds_path: /mnt/weka/cache
    cufile_buffer_size: 8192
    
    # Advanced settings
    extra_config:
      gds_io_threads: 16
    
    # Observability
    enable_kv_events: true
