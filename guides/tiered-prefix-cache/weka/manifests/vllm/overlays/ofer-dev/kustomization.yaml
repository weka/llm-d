apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weka-ofer

resources:
  - ../aggregated-weka

patches:
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "quay.io/weka.io/llm-d:fix-patches-1"
