apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../model-llama3-70b

patches:
  # Replace kv-transfer-config: MultiConnector → NixlConnector only
  # Arg index 10 is the kv-transfer-config JSON value in both deployments
  - target:
      kind: Deployment
      name: decode
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/10
        value: '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'

  - target:
      kind: Deployment
      name: prefill
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/10
        value: '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'

  # Remove LMCACHE env vars and PROMETHEUS_MULTIPROC_DIR from both deployments
  # Indices (0-based): 6=LMCACHE_USE_EXPERIMENTAL, 7=LMCACHE_CHUNK_SIZE,
  # 8=LMCACHE_GDS_PATH, 9=LMCACHE_CUFILE_BUFFER_SIZE, 10=LMCACHE_LOCAL_CPU,
  # 11=LMCACHE_EXTRA_CONFIG, 12=PROMETHEUS_MULTIPROC_DIR
  # Remove highest index first to avoid shifting
  - target:
      kind: Deployment
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env/12
      - op: remove
        path: /spec/template/spec/containers/0/env/11
      - op: remove
        path: /spec/template/spec/containers/0/env/10
      - op: remove
        path: /spec/template/spec/containers/0/env/9
      - op: remove
        path: /spec/template/spec/containers/0/env/8
      - op: remove
        path: /spec/template/spec/containers/0/env/7
      - op: remove
        path: /spec/template/spec/containers/0/env/6

  # Remove lmcache-prometheus volumeMount (index 3) and volume (index 3)
  - target:
      kind: Deployment
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/3
      - op: remove
        path: /spec/template/spec/volumes/3
