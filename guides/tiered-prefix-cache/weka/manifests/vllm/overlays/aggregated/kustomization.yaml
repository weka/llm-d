apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

patches:
  - path: deployment-patch.yaml

  # Rename deployment to "vllm-engine"
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /metadata/name
        value: vllm-engine

  # Set ports for aggregated: 8200 (vLLM API) only — no NIXL port 5600
  - target:
      kind: Deployment
      name: vllm-engine
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports
        value:
          - containerPort: 8200
            name: metrics
            protocol: TCP
