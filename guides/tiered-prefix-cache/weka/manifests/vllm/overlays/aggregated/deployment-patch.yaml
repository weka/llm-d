apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-model-server
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        llm-d.ai/role: decode
    spec:
      serviceAccountName: weka-vllm
      initContainers:
      - name: routing-proxy
        image: ghcr.io/llm-d/llm-d-routing-sidecar:v0.5.0
        imagePullPolicy: Always
        args:
        - --port=8000
        - --vllm-port=8200
        - --connector=nixlv2
        - --secure-proxy=false
        ports:
        - containerPort: 8000
        resources: {}
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
      - name: create-cufile
        image: quay.io/weka.io/llm-d:v0.5.0-latest-bef6991-dc515f3f-P33292
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        args:
        - curl -fsSL -o /tmp/amgctl https://github.com/4D0R/amg-utils/releases/download/v0.1.21-gds/amgctl-linux-amd64
          && chmod +x /tmp/amgctl && /tmp/amgctl host config cufile /output/cufile.json
        volumeMounts:
        - name: cufile-output
          mountPath: /output
      containers:
      - name: vllm
        args:
        - Qwen/Qwen3-32B
        - --port
        - '8200'
        - --served-model-name
        - Qwen/Qwen3-32B
        - --tensor-parallel-size
        - '8'
        - --block-size
        - '128'
        - --kv-transfer-config
        - '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
        - --no-enable-prefix-caching
        - --disable-log-requests
        - --disable-uvicorn-access-log
        - --max-model-len
        - '32000'
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 8200
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8200
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: '32'
            memory: 128Gi
            nvidia.com/gpu: '8'
          requests:
            cpu: '32'
            memory: 128Gi
            nvidia.com/gpu: '8'
        startupProbe:
          httpGet:
            path: /health
            port: 8200
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 120
