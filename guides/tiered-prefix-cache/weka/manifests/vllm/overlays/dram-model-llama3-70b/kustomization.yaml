apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../model-llama3-70b

patches:
  # Switch LMCache from GDS/Weka to DRAM mode
  # Change LMCACHE_LOCAL_CPU to "true" and remove GDS-specific env vars
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/10/value
        value: "true"
      - op: remove
        path: /spec/template/spec/containers/0/env/11
      - op: remove
        path: /spec/template/spec/containers/0/env/9
      - op: remove
        path: /spec/template/spec/containers/0/env/8

  # Add DRAM-specific LMCache env vars
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_MAX_LOCAL_CPU_SIZE
          value: "300"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_PRE_CACHING_HASH_ALGORITHM
          value: "sha256"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_SAVE_DECODE_CACHE
          value: "false"

  # Increase memory to 1TiB for DRAM-based LMCache
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1524Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1524Gi
