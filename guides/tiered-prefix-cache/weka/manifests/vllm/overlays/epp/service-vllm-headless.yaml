# Headless Service for vLLM backends.
# Istio's HTTPRoute cannot resolve InferencePool directly (InvalidKind),
# so we route via this Service → EPP ext_proc handles model-aware routing.
#
# Use as a resource in any setup that combines EPP + Istio gateway.
apiVersion: v1
kind: Service
metadata:
  name: llm-d-model-server
spec:
  clusterIP: None
  selector:
    llm-d.ai/inference-serving: "true"
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
