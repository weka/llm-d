# Inferencepool values for KV-aware routing with DRAM-extended cache capacity.
# Model-specific scoring config is added via kustomize ConfigMap patch (model/<model>/epp-configmap-patch.yaml).
inferenceExtension:
  replicas: 1
  image:
    name: llm-d-inference-scheduler
    hub: ghcr.io/llm-d
    tag: v0.5.0
    pullPolicy: Always
  extProcPort: 9002
  pluginsConfigFile: "precise-prefix-cache-config.yaml"

inferencePool:
  targetPortNumber: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inference-serving: "true"

provider:
  name: istio
  istio:
    destinationRule:
      trafficPolicy:
        connectionPool:
          http:
            http1MaxPendingRequests: 256000
            http2MaxRequests: 256000
            idleTimeout: 900s
            maxRequestsPerConnection: 256000
          tcp:
            connectTimeout: 900s
            maxConnectionDuration: 1800s
            maxConnections: 256000
        tls:
          insecureSkipVerify: true
          mode: SIMPLE
