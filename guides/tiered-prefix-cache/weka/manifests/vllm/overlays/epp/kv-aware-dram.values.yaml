# Inferencepool values for KV-aware routing with DRAM-extended cache capacity.
# hashSeed must match PYTHONHASHSEED set on vLLM pods (0 in this deployment).
# lruCapacityPerServer sized for GPU (~2,300 blocks) + DRAM (~60,000 blocks).
inferenceExtension:
  replicas: 1
  image:
    name: llm-d-inference-scheduler
    hub: ghcr.io/llm-d
    tag: v0.5.0
    pullPolicy: Always
  extProcPort: 9002
  pluginsConfigFile: "precise-prefix-cache-config.yaml"
  pluginsCustomConfig:
    precise-prefix-cache-config.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      - type: single-profile-handler
      - type: precise-prefix-cache-scorer
        parameters:
          tokenProcessorConfig:
            blockSize: 256
            hashSeed: '0'
          indexerConfig:
            tokenizersPoolConfig:
              modelName: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
              hf:
                tokenizersCacheDir: /tmp/tokenizers
          kvEventsConfig:
            topicFilter: kv@
            concurrency: 4
            discoverPods: true
            podDiscoveryConfig:
              socketPort: 5557
      - type: kv-cache-utilization-scorer
      - type: queue-scorer
        parameters:
          hashBlockSize: 5
          maxPrefixBlocksToMatch: 512
          lruCapacityPerServer: 62500
      - type: max-score-picker
      schedulingProfiles:
      - name: default
        plugins:
        - pluginRef: precise-prefix-cache-scorer
          weight: 3.0
        - pluginRef: kv-cache-utilization-scorer
          weight: 2.0
        - pluginRef: queue-scorer
          weight: 2.0
        - pluginRef: max-score-picker

inferencePool:
  targetPortNumber: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inference-serving: "true"

provider:
  name: istio
  istio:
    destinationRule:
      trafficPolicy:
        connectionPool:
          http:
            http1MaxPendingRequests: 256000
            http2MaxRequests: 256000
            idleTimeout: 900s
            maxRequestsPerConnection: 256000
          tcp:
            connectTimeout: 900s
            maxConnectionDuration: 1800s
            maxConnections: 256000
        tls:
          insecureSkipVerify: true
          mode: SIMPLE
