# Inferencepool values for KV-aware routing with disaggregated tokenization.
# Uses llm-d-uds-tokenizer sidecar for EPP tokenization via Unix domain socket,
# ensuring identical tokenization between EPP and vLLM.
# Model-specific scoring config is added via kustomize ConfigMap patch.
inferenceExtension:
  replicas: 1
  image:
    name: llm-d-inference-scheduler
    hub: ghcr.io/llm-d
    tag: v0.5.0
    pullPolicy: Always
  extProcPort: 9002
  pluginsConfigFile: "precise-prefix-cache-config.yaml"

  # UDS tokenizer sidecar: runs Python tokenizer in the EPP pod,
  # serves via Unix domain socket for cross-language compatibility.
  sidecar:
    enabled: true
    image: ghcr.io/llm-d/llm-d-uds-tokenizer:v0.5.0
    imagePullPolicy: IfNotPresent
    name: tokenizer-uds
    volumeMounts:
      - mountPath: /tmp/tokenizer
        name: tokenizer-uds

  # Shared volume for UDS socket between EPP and sidecar
  volumes:
    - emptyDir: {}
      name: tokenizer-uds

  # EPP mounts the shared volume to access the UDS socket
  volumeMounts:
    - mountPath: /tmp/tokenizer
      name: tokenizer-uds

inferencePool:
  targetPortNumber: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inference-serving: "true"

provider:
  name: istio
  istio:
    destinationRule:
      trafficPolicy:
        connectionPool:
          http:
            http1MaxPendingRequests: 256000
            http2MaxRequests: 256000
            idleTimeout: 900s
            maxRequestsPerConnection: 256000
          tcp:
            connectTimeout: 900s
            maxConnectionDuration: 1800s
            maxConnections: 256000
        tls:
          insecureSkipVerify: true
          mode: SIMPLE
