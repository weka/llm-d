# Inferencepool values for basic aggregated routing.
# Simple queue-based load balancing without KV-aware or P/D routing.
inferenceExtension:
  replicas: 1
  image:
    name: llm-d-inference-scheduler
    hub: ghcr.io/llm-d
    tag: v0.5.0
    pullPolicy: Always
  extProcPort: 9002

inferencePool:
  targetPortNumber: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inference-serving: "true"

provider:
  name: istio
  istio:
    destinationRule:
      trafficPolicy:
        connectionPool:
          http:
            http1MaxPendingRequests: 256000
            http2MaxRequests: 256000
            idleTimeout: 900s
            maxRequestsPerConnection: 256000
          tcp:
            connectTimeout: 900s
            maxConnectionDuration: 1800s
            maxConnections: 256000
        tls:
          insecureSkipVerify: true
          mode: SIMPLE
