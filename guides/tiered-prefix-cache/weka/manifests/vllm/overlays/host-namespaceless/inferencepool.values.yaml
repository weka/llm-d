inferenceExtension:
  replicas: 1
  image:
    # upstream GIE epp image does NOT support PD, have to use `llm-d-inference-scheduler`
    name: llm-d-inference-scheduler
    hub: ghcr.io/llm-d
    tag: v0.4.0
    pullPolicy: Always
  extProcPort: 9002
  pluginsConfigFile: "pd-config.yaml"
  pluginsCustomConfig:
    pd-config.yaml: |
      # ALWAYS DO PD IN THIS EXAMPLE (THRESHOLD 0)
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      - type: prefill-header-handler
      - type: prefill-filter
      - type: decode-filter
      - type: max-score-picker
      - type: queue-scorer
        parameters:
          hashBlockSize: 5
          maxPrefixBlocksToMatch: 256
          lruCapacityPerServer: 31250
      - type: pd-profile-handler
        parameters:
          threshold: 0
          hashBlockSize: 5
      schedulingProfiles:
      - name: prefill
        plugins:
        - pluginRef: prefill-filter
        - pluginRef: queue-scorer
          weight: 1.0
        - pluginRef: max-score-picker
      - name: decode
        plugins:
        - pluginRef: decode-filter
        - pluginRef: queue-scorer
          weight: 1.0
        - pluginRef: max-score-picker

    # For aggregated LMCache serving (precise-prefix-cache-scorer), use this config instead.
    # Set pluginsConfigFile: "precise-prefix-cache-config.yaml" to activate.
    # hashSeed must match PYTHONHASHSEED set on vLLM pods (0 in this deployment).
    precise-prefix-cache-config.yaml: |
      apiVersion: inference.networking.x-k8s.io/v1alpha1
      kind: EndpointPickerConfig
      plugins:
      - type: single-profile-handler
      - type: precise-prefix-cache-scorer
        parameters:
          tokenProcessorConfig:
            blockSize: 64
            hashSeed: '0'
          indexerConfig:
            tokenizersPoolConfig:
              modelName: RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
              hf:
                tokenizersCacheDir: /tmp/tokenizers
          kvEventsConfig:
            topicFilter: kv@
            concurrency: 4
            discoverPods: true
            podDiscoveryConfig:
              socketPort: 5557
      - type: kv-cache-utilization-scorer
      - type: queue-scorer
      - type: max-score-picker
      schedulingProfiles:
      - name: default
        plugins:
        - pluginRef: precise-prefix-cache-scorer
          weight: 3.0
        - pluginRef: kv-cache-utilization-scorer
          weight: 2.0
        - pluginRef: queue-scorer
          weight: 2.0
        - pluginRef: max-score-picker

inferencePool:
  targetPortNumber: 8000
  modelServerType: vllm
  modelServers:
    matchLabels:
      llm-d.ai/inference-serving: "true"

provider:
  name: istio
  istio:
    destinationRule:
      trafficPolicy:
        connectionPool:
          http:
            http1MaxPendingRequests: 256000
            http2MaxRequests: 256000
            idleTimeout: 900s
            maxRequestsPerConnection: 256000
          tcp:
            connectTimeout: 900s
            maxConnectionDuration: 1800s
            maxConnections: 256000
        tls:
          insecureSkipVerify: true
          mode: SIMPLE
