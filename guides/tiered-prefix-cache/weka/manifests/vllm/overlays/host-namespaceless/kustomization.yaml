apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../host
  - ../../../gateway/overlays/istio

helmCharts:
  - name: inferencepool
    repo: oci://registry.k8s.io/gateway-api-inference-extension/charts
    version: v1.3.0
    releaseName: weka-vllm
    valuesFile: inferencepool.values.yaml

patches:
  # Strip hardcoded namespace from all resources so it can be controlled via kubectl -n
  - target:
      kind: Deployment
    patch: |-
      - op: remove
        path: /metadata/namespace
  - target:
      kind: ServiceAccount
    patch: |-
      - op: remove
        path: /metadata/namespace
  - target:
      kind: Gateway
    patch: |-
      - op: remove
        path: /metadata/namespace
  - target:
      kind: HTTPRoute
    patch: |-
      - op: remove
        path: /metadata/namespace
  - target:
      kind: ConfigMap
    patch: |-
      - op: remove
        path: /metadata/namespace
  - target:
      kind: Role
    patch: |-
      - op: remove
        path: /metadata/namespace
  - target:
      kind: RoleBinding
    patch: |-
      - op: remove
        path: /metadata/namespace
      - op: remove
        path: /subjects/0/namespace
  - target:
      kind: Service
    patch: |-
      - op: remove
        path: /metadata/namespace
  - target:
      kind: InferencePool
    patch: |-
      - op: remove
        path: /metadata/namespace

  # Use smaller model for testing (only vllm deployments, not EPP)
  - target:
      kind: Deployment
      name: decode
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: RedHatAI/Llama-3.2-1B-Instruct-FP8-dynamic
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: RedHatAI/Llama-3.2-1B-Instruct-FP8-dynamic
  - target:
      kind: Deployment
      name: prefill
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: RedHatAI/Llama-3.2-1B-Instruct-FP8-dynamic
      - op: replace
        path: /spec/template/spec/containers/0/args/4
        value: RedHatAI/Llama-3.2-1B-Instruct-FP8-dynamic

  # EPP: remove hardcoded --pool-namespace so it uses NAMESPACE env var from downward API
  - target:
      kind: Deployment
      name: weka-vllm-epp
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/args/2
      - op: remove
        path: /spec/template/spec/containers/0/args/2
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # Scale down prefill to 2 replicas
  - target:
      kind: Deployment
      name: prefill
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

labels:
  - pairs:
      llm-d.ai/model: Llama-32-1B-Instruct
    includeSelectors: false
