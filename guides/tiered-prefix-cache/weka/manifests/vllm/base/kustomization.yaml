apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../../recipes/vllm/standard

labels:
  - pairs:
      llm-d.ai/inference-serving: "true"
      llm-d.ai/model: Llama-33-70B-Instruct

patches:
  # Update image to latest llm-d
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "quay.io/weka.io/llm-d:v0.5.0-latest-bef6991-dc515f3f-P33292"

  # Update command and args for WEKA deployment
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - "vllm"
          - "serve"
      - op: replace
        path: /spec/template/spec/containers/0/args
        value:
          - "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"
          - "--port"
          - "8000"
          - "--served-model-name"
          - "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"
          - "--block-size"
          - "128"
          - "--kv-transfer-config"
          - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
          - "--disable-log-requests"
          - "--disable-uvicorn-access-log"
          - "--max-model-len"
          - "32000"

  # Remove HF_TOKEN from base recipe (not needed for WEKA deployment)
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env/0

  # Add vLLM environment variables
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VLLM_NIXL_SIDE_CHANNEL_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: VLLM_LOGGING_LEVEL
          value: "INFO"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NCCL_DEBUG
          value: "INFO"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: HF_HOME
          value: "/mnt/weka/hf_cache"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NVIDIA_GDRCOPY
          value: "enabled"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: NVIDIA_GDS
          value: "enabled"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_USE_EXPERIMENTAL
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_CHUNK_SIZE
          value: "256"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_GDS_PATH
          value: /mnt/weka/cache
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_CUFILE_BUFFER_SIZE
          value: "8192"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_LOCAL_CPU
          value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_EXTRA_CONFIG
          value: '{"gds_io_threads": 16}'
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PROMETHEUS_MULTIPROC_DIR
          value: /tmp/lmcache_prometheus
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PYTHONHASHSEED
          value: "0"

  # Update resources for WEKA deployment
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            cpu: "8"
            memory: 64Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: "8"
            memory: 64Gi
            nvidia.com/gpu: "1"

  # Add initContainers for WEKA GDS setup
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: enable-nvidia-gds
            image: "ghcr.io/llm-d/llm-d-cuda-dev-ubuntu:sha-990d488"
            command: ["/bin/bash", "-c"]
            args:
              - |
                # Temporary fix: install RDMA libs if missing from image (remove once new image is built)
                # Load GDS kernel modules
                lsmod | grep -q nvidia_fs || modprobe nvidia_fs || { echo "ERROR: Failed to load nvidia_fs" >&2; exit 1; }
                lsmod | grep -q nvidia_peermem || modprobe nvidia_peermem || { echo "ERROR: Failed to load nvidia_peermem" >&2; exit 1; }
                echo "GDS modules loaded successfully"
                # Initialize NVIDIA driver context so RDMA devices are visible to gdscheck
                nvidia-smi > /dev/null 2>&1 || true
                # Verify GDS setup
                echo "=== GDS Configuration Check ==="
                GDS_OUT=$(/usr/local/cuda/gds/tools/gdscheck -p 2>&1)
                echo "$GDS_OUT"
                if echo "$GDS_OUT" | grep -q "WekaFS.*: Supported"; then
                  echo "GDS: WekaFS Supported, RDMA Up"
                else
                  echo "ERROR: WekaFS GDS not supported" >&2
                  exit 1
                fi
            volumeMounts:
              - name: ib-uverbs
                mountPath: /dev/infiniband
              - name: cufile-output
                mountPath: /etc/cufile.json
                subPath: cufile.json
            securityContext:
              privileged: true
              runAsUser: 0


  # Replace startup probe with GDS-specific probe
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 120

  # Update readiness probe
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          httpGet:
            path: /v1/models
            port: 8000
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

  # Update liveness probe
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

  # Update service account
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: add
        path: /spec/template/spec/serviceAccountName
        value: weka-vllm

  # Remove data volume from base (not needed for WEKA)
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: remove
        path: /spec/template/spec/volumes/0

  # Update shm volume to add sizeLimit
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

  # Add WEKA storage volumes (will be patched by storage overlays)
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: weka-storage
          # This will be patched by storage overlays (pvc or hostPath)
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: cufile-output
          emptyDir: {}


  # Remove data volumeMount from base (not needed for WEKA)
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/0

  # Add WEKA storage volume mounts
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: weka-storage
          mountPath: /mnt/weka
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: cufile-output
          mountPath: /etc/cufile.json
          subPath: cufile.json
          readOnly: true

  # Add emptyDir volume for LMCache prometheus multiproc dir
  - target:
      kind: Deployment
      name: llm-d-model-server
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: lmcache-prometheus
          emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: lmcache-prometheus
          mountPath: /tmp/lmcache_prometheus
