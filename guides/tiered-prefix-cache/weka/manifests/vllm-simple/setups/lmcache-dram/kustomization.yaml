apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# vLLM + LMCache with DRAM/CPU backend (no Weka GDS).
# Deploy: kubectl apply -k guides/tiered-prefix-cache/weka/manifests/vllm-simple/setups/lmcache-dram

namespace: weka

resources:
  - ../../overlays/model/llama3-70b-bf16

patches:
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_USE_EXPERIMENTAL
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_CHUNK_SIZE
          value: "256"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_LOCAL_CPU
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_PRE_CACHING_HASH_ALGORITHM
          value: "sha256"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LMCACHE_SAVE_DECODE_CACHE
          value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PROMETHEUS_MULTIPROC_DIR
          value: /tmp/lmcache_prometheus
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1524Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1524Gi
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: lmcache-prometheus
          emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: lmcache-prometheus
          mountPath: /tmp/lmcache_prometheus
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--kv-transfer-config"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: '{"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
