apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# vLLM + LMCache with Weka GDS backend (pure Weka, no CPU/DRAM tier).
# Deploy: kubectl apply -k guides/tiered-prefix-cache/weka/manifests/vllm-simple/setups/lmcache-weka

namespace: weka

resources:
  - ../../overlays/model/llama3-70b-bf16

patches:
  # LMCache Weka GDS env vars (LMCACHE_GDS_PATH, LMCACHE_CHUNK_SIZE, etc.)
  - path: ../../../vllm/overlays/cache/lmcache-weka/env-patch.yaml
    target:
      kind: Deployment
      name: vllm

  # Explicitly disable CPU/DRAM tier (pure Weka GDS)
  - path: ../../../vllm/overlays/cache/no-cpu-cache/env-patch.yaml
    target:
      kind: Deployment
      name: vllm

  # Add lmcache-prometheus volume + volumeMount
  - path: ../../../vllm/overlays/cache/lmcache-weka/volume-patch.yaml
    target:
      kind: Deployment
      name: vllm

  # Add --kv-transfer-config with LMCacheConnectorV1
  - path: ../../../vllm/overlays/cache/lmcache-weka/args-patch-aggr.yaml
    target:
      kind: Deployment
      name: vllm
