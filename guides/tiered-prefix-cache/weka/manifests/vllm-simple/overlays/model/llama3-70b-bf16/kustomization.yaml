apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Llama-3.3-70B-Instruct (BF16) model overlay.
# Sets model path, TP=8, 8 GPUs, 256Gi memory.
# To add a cache tier, use a setup in ../../setups/ instead of applying this directly.

namespace: weka

resources:
  - ../../../base

patches:
  - path: patch.yaml
    target:
      kind: Deployment
      name: vllm
