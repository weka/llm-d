# Set model, tensor parallelism, and GPU resources for Llama-3.3-70B-Instruct (BF16).
# TP=4 on GPUs 0-3 (leaving 4-7 free).
- op: replace
  path: /spec/template/spec/containers/0/args
  value:
    - "meta-llama/Llama-3.3-70B-Instruct"
    - "--port"
    - "8000"
    - "--served-model-name"
    - "meta-llama/Llama-3.3-70B-Instruct"
    - "--tensor-parallel-size"
    - "4"
    - "--block-size"
    - "128"
    - "--gpu-memory-utilization"
    - "0.80"
    - "--disable-uvicorn-access-log"
    - "--max-model-len"
    - "125000"
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    limits:
      cpu: "16"
      memory: 256Gi
      nvidia.com/gpu: "4"
    requests:
      cpu: "16"
      memory: 256Gi
      nvidia.com/gpu: "4"
- op: add
  path: /spec/template/spec/containers/0/env/-
  value:
    name: CUDA_VISIBLE_DEVICES
    value: "0,1,2,3"
