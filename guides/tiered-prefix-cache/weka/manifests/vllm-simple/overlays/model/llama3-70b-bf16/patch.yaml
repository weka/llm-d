# Set model, tensor parallelism, and GPU resources for Llama-3.3-70B-Instruct (BF16).
# TP=8 for 70B BF16 (~140 GB weights across 8 GPUs).
- op: replace
  path: /spec/template/spec/containers/0/args
  value:
    - "meta-llama/Llama-3.3-70B-Instruct"
    - "--port"
    - "8000"
    - "--served-model-name"
    - "meta-llama/Llama-3.3-70B-Instruct"
    - "--tensor-parallel-size"
    - "8"
    - "--block-size"
    - "128"
    - "--gpu-memory-utilization"
    - "0.80"
    - "--disable-log-requests"
    - "--disable-uvicorn-access-log"
    - "--max-model-len"
    - "125000"
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    limits:
      cpu: "16"
      memory: 256Gi
      nvidia.com/gpu: "8"
    requests:
      cpu: "16"
      memory: 256Gi
      nvidia.com/gpu: "8"
